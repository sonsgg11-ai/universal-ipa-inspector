name: IPAInspector
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  IPAInspector:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Assets.xcassets
      - path: Sources/IPAKit
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: IPA Inspector
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Declare the IPA package type so the app appears in the Files share
        # sheet and in "Open in…" — without this the user cannot hand a 230 MB
        # IPA to the app at all (long-press → Share shows no destination).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.yourname.ipainspector.ipa
            UTTypeDescription: iOS App Package (IPA)
            UTTypeConformsTo:
              - public.data
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App Package (IPA)
            LSItemContentTypes:
              - com.yourname.ipainspector.ipa
              - com.pkware.zip-archive
              - public.zip-archive
            LSHandlerRank: Owner
          - CFBundleTypeName: Archive
            LSItemContentTypes:
              - public.data
            LSHandlerRank: Alternate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.ipainspector
        MARKETING_VERSION: 0.2.1
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
        ENABLE_PREVIEWS: true
schemes:
  IPAInspector:
    build:
      targets:
        IPAInspector: all
    run:
      config: Debug
